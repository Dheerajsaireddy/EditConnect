@media (prefers-reduced-motion: reduce) {

// ==========================================

let fluidRaf = null;

function initFluidLogo() {
  if (fluidRaf) {
    cancelAnimationFrame(fluidRaf);
    fluidRaf = null;
  }
  const canvas = document.getElementById("fluidLogo");
  if (!canvas) return;

  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = 230;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.scale(dpr, dpr);

  const cx = size / 2;
  const cy = size / 2;
  let pointerX = 0;
  let pointerY = 0;
  let smoothX = 0;
  let smoothY = 0;
  let energy = 1;

  const onMove = e => {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    pointerX = Math.max(-1, Math.min(1, ((clientX - rect.left) / rect.width - 0.5) * 2));
    pointerY = Math.max(-1, Math.min(1, ((clientY - rect.top) / rect.height - 0.5) * 2));
    energy = 1.65;
  };

  const onLeave = () => {
    pointerX = 0;
    pointerY = 0;
  };

  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("touchmove", onMove, { passive: true });
  canvas.addEventListener("pointerleave", onLeave);

  function drawFluidLayer(t, baseRadius, freqA, freqB, amp, phase, fillStyle, strokeStyle) {
    const steps = 96;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI * 2;
      const w1 = Math.sin(theta * freqA + t * 2.1 + phase) * amp;
      const w2 = Math.cos(theta * freqB - t * 1.6 + phase * 1.3) * (amp * 0.65);
      const w3 = Math.sin(theta * 2 + t * 3.0) * (amp * 0.35);
      const tiltOffset = (Math.cos(theta) * smoothX + Math.sin(theta) * smoothY) * 6;
      const r = baseRadius + (w1 + w2 + w3) * energy + tiltOffset;
      const x = cx + Math.cos(theta) * r;
      const y = cy + Math.sin(theta) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = fillStyle;
    ctx.fill();
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function frame(now) {
    if (!document.body.contains(canvas)) {
      fluidRaf = null;
      return;
    }
    const t = now * 0.001;
    smoothX += (pointerX - smoothX) * 0.08;
    smoothY += (pointerY - smoothY) * 0.08;
    energy += (1 - energy) * 0.04;

    ctx.clearRect(0, 0, size, size);

    // 3D Orbiting Liquid Droplets (Back Z-layer)
    const droplets = [
      { angle: t * 1.15, dist: 86, z: Math.sin(t * 1.15), r: 7.5, color: "#38bdf8" },
      { angle: t * 0.85 + 2.1, dist: 92, z: Math.sin(t * 0.85 + 2.1), r: 5.5, color: "#818cf8" },
      { angle: -t * 1.35 + 4.2, dist: 82, z: Math.sin(-t * 1.35 + 4.2), r: 6.5, color: "#168BFF" }
    ];

    droplets.filter(d => d.z < 0).forEach(d => {
      const dx = cx + Math.cos(d.angle) * d.dist + smoothX * 8;
      const dy = cy + Math.sin(d.angle) * (d.dist * 0.42) + smoothY * 8;
      const rad = d.r * (0.75 + (d.z + 1) * 0.25);
      const dg = ctx.createRadialGradient(dx - rad * 0.3, dy - rad * 0.3, 1, dx, dy, rad);
      dg.addColorStop(0, "#ffffff");
      dg.addColorStop(0.4, d.color);
      dg.addColorStop(1, "rgba(18, 107, 255, 0.1)");
      ctx.beginPath();
      ctx.arc(dx, dy, rad, 0, Math.PI * 2);
      ctx.fillStyle = dg;
      ctx.fill();
    });

    // Outer Iridescent Fluid Aura
    const outerGrad = ctx.createRadialGradient(
      cx - 24 + smoothX * 16,
      cy - 24 + smoothY * 16,
      10,
      cx,
      cy,
      82
    );
    outerGrad.addColorStop(0, "rgba(56, 189, 248, 0.48)");
    outerGrad.addColorStop(0.55, "rgba(18, 107, 255, 0.32)");
    outerGrad.addColorStop(1, "rgba(129, 140, 248, 0.08)");
    drawFluidLayer(t, 68, 3, 5, 5.5, 0, outerGrad, "rgba(56, 189, 248, 0.35)");

    // Main 3D Morphing Liquid Core
    const coreGrad = ctx.createRadialGradient(
      cx - 22 + smoothX * 18,
      cy - 26 + smoothY * 18,
      6,
      cx + 10,
      cy + 14,
      74
    );
    coreGrad.addColorStop(0, "#7dd3fc");
    coreGrad.addColorStop(0.28, "#168BFF");
    coreGrad.addColorStop(0.72, "#0b3b9c");
    coreGrad.addColorStop(1, "#05153d");
    drawFluidLayer(t * 1.15, 58, 4, 3, 4.8, 1.4, coreGrad, "rgba(125, 211, 252, 0.55)");

    // Inner Subsurface Liquid Wave
    const innerGrad = ctx.createLinearGradient(cx - 45, cy - 45, cx + 45, cy + 45);
    innerGrad.addColorStop(0, "rgba(255, 255, 255, 0.34)");
    innerGrad.addColorStop(0.5, "rgba(56, 189, 248, 0.14)");
    innerGrad.addColorStop(1, "rgba(129, 140, 248, 0.28)");
    drawFluidLayer(-t * 1.3, 46, 3, 4, 3.6, 2.7, innerGrad, null);

    // Glossy 3D Top-Left Specular Liquid Highlight
    ctx.save();
    ctx.translate(cx - 20 + smoothX * 12, cy - 22 + smoothY * 12);
    ctx.rotate(-0.55);
    const specGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, 22);
    specGrad.addColorStop(0, "rgba(255, 255, 255, 0.85)");
    specGrad.addColorStop(0.5, "rgba(186, 230, 253, 0.35)");
    specGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = specGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Floating 3D Glass Play Emblem in Center
    ctx.save();
    ctx.translate(cx + smoothX * 9, cy + smoothY * 9);
    ctx.shadowColor = "rgba(3, 5, 8, 0.45)";
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    ctx.beginPath();
    ctx.moveTo(-11, -15);
    ctx.lineTo(16, 0);
    ctx.lineTo(-11, 15);
    ctx.closePath();
    ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
    ctx.fill();
    ctx.restore();

    // 3D Orbiting Liquid Droplets (Front Z-layer)
    droplets.filter(d => d.z >= 0).forEach(d => {
      const dx = cx + Math.cos(d.angle) * d.dist + smoothX * 12;
      const dy = cy + Math.sin(d.angle) * (d.dist * 0.42) + smoothY * 12;
      const rad = d.r * (0.85 + d.z * 0.35);
      const dg = ctx.createRadialGradient(dx - rad * 0.35, dy - rad * 0.35, 1, dx, dy, rad);
      dg.addColorStop(0, "#ffffff");
      dg.addColorStop(0.45, d.color);
      dg.addColorStop(1, "rgba(18, 107, 255, 0.15)");
      ctx.beginPath();
      ctx.arc(dx, dy, rad, 0, Math.PI * 2);
      ctx.fillStyle = dg;
      ctx.fill();
    });

    fluidRaf = requestAnimationFrame(frame);
  }

  fluidRaf = requestAnimationFrame(frame);
}

// ==========================================
// NAVIGATION RENDERER
// ==========================================
function renderNav() {
  const u = currentUser();
  const mode = activeMode();

  let links = `<a href="#/home">Home</a>`;

  if (mode === "client") {
    links += `<a href="#/explore">Explore Editors</a>`;
    if (u) links += `<a href="#/activity">Client Activity</a>`;
  } else {
    if (u) links += `<a href="#/studio">Portfolio Studio</a>`;
  }

  if (u) {
    links += `<span class="role-pill">${u.role === "client" ? "Client Mode" : "Editor Mode"}</span>`;
    links += `<a href="#/logout" class="signin">Sign out (${esc(u.name.split(" ")[0])})</a>`;
  } else {
    links += `<a href="#/auth" class="signin">Sign in / Register</a>`;
  }

  menu.innerHTML = links;

  const currentHash = location.hash || "#/home";
  menu.querySelectorAll("a").forEach(a => {
    if (a.getAttribute("href") === currentHash) {
      a.setAttribute("aria-current", "true");
    }
  });
}

              </div>
            `).join("")}
          </div>
        ` : ""}
      </div>

      <div class="panel">
        <h3 style="margin-bottom:14px;font-weight:700">2. Rates, Experience &amp; Branch Tags</h3>
        <form data-form="saveEditorProfile">
          <label class="field">Display Name
            <input name="name" required maxlength="60" value="${esc(u.name)}">
          </label>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
            <label class="field">Pricing Rate
              <input name="pricing" required maxlength="40" value="${esc(u.pricing || "")}" placeholder="e.g., $40 / video">
            </label>
            <label class="field">Editing Experience
              <input name="experience" required maxlength="40" value="${esc(u.experience || "")}" placeholder="e.g., 3 Years">
            </label>
            <label class="field">Availability Status
              <select name="availability">
                <option ${u.availability === "Available Now" ? "selected" : ""}>Available Now</option>
                <option ${u.availability === "Open for Long-Term" ? "selected" : ""}>Open for Long-Term</option>
                <option ${u.availability === "Limited Slots" ? "selected" : ""}>Limited Slots</option>
              </select>
            </label>
          </div>
          <label class="field">Bio &amp; Editing Style
            <textarea name="bio" maxlength="300" placeholder="Describe your editing strengths...">${esc(u.bio || "")}</textarea>
          </label>
          <div class="field">
            <span>Active Branch Tags (Click to toggle)</span>
            <div class="branch-picks">
              ${DEFAULT_BRANCHES.map(b => `
                <button type="button" class="branch-chip ${branches.includes(b) ? "selected" : ""}" data-act="toggleBranch" data-branch="${esc(b)}">
                  ${branches.includes(b) ? "✓ " : "+ "}${esc(b)}
                </button>
              `).join("")}
            </div>
          </div>
          <button type="submit" class="btn primary">Save Editor Profile</button>
        </form>
      </div>
    </div>`;
  },

  activity() {
    const u = currentUser();
    if (!u) return Views.auth();
    const hist = u.history || [];

    return `
    <div class="wrap pg">
      <h2 class="ptitle">Client Activity</h2>
      <p class="muted">Projects you completed and CONNECTS awarded to editors.</p>

      <div class="stats">
        <div><b>${hist.length}</b><span class="muted">Projects Completed</span></div>
        <div><b>${hist.reduce((a, b) => a + (b.connectsAwarded || 0), 0)}</b><span class="muted">Total CONNECTS Awarded</span></div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font-weight:700">Completed Project History</h3>
          <a class="btn primary small" href="#/explore">Explore More Editors →</a>
        </div>
        ${hist.length ? hist.map(h => `
          <div class="row">
            <div>
              <b>${esc(h.editorName)}</b> — <span class="muted">${esc(h.projectTitle)}</span>
            </div>
            <div style="text-align:right">
              <span class="stars-display">${h.stars} ★</span>
              <span class="tag" style="margin-left:8px">+${h.connectsAwarded} CONNECTS</span>
            </div>
          </div>
        `).join("") : `<p class="muted">No completed projects logged yet. Visit Explore Editors to rate an editor.</p>`}
      </div>
    </div>`;
  },

  auth() {
    return `
    <div class="wrap pg narrow">
      <div class="panel">
        <h2 style="margin-bottom:6px;font-weight:700">${authMode === "in" ? "Sign in to EditConnect" : "Create your profile"}</h2>
        <p class="muted" style="margin-bottom:18px;font-size:.92rem">
          ${authMode === "in" ? "Access your Client or Editor account." : "Register as a Client to explore editors, or as an Editor to showcase your portfolio."}
        </p>

        <form data-form="auth">
          ${authMode === "up" ? `
            <div class="field">
              <span>I am registering as a</span>
              <div class="mode-switch" style="width:100%;margin-top:8px">
                <button type="button" style="flex:1" class="mode-btn ${authRole === "client" ? "active" : ""}" data-act="setAuthRole" data-role="client">Client</button>
                <button type="button" style="flex:1" class="mode-btn ${authRole === "editor" ? "active" : ""}" data-act="setAuthRole" data-role="editor">Video Editor</button>
              </div>
            </div>

            <label class="field">Full Name
              <input name="name" required maxlength="60" placeholder="Your name or channel name">
            </label>

            ${authRole === "editor" ? `
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <label class="field">Starting Rate
                  <input name="pricing" required maxlength="35" placeholder="e.g., $35 / video">
                </label>
                <label class="field">Experience
                  <input name="experience" required maxlength="35" placeholder="e.g., 2 Years">
                </label>
              </div>
            ` : ""}
          ` : ""}

          <label class="field">Email
            <input name="email" type="email" required placeholder="you@example.com">
          </label>

          <label class="field">Password
            <input name="password" type="password" required minlength="4" placeholder="At least 4 characters">
          </label>

          <button type="submit" class="btn primary" style="width:100%">
            ${authMode === "in" ? "Sign In" : `Register as ${authRole === "client" ? "Client" : "Editor"}`}
          </button>
        </form>

        <p style="margin-top:16px;font-size:.92rem;color:var(--muted);text-align:center">
          ${authMode === "in"
            ? `New to EditConnect? <a href="#" style="color:var(--cyan)" data-act="toggleAuthMode">Create an account</a>`
            : `Already registered? <a href="#" style="color:var(--cyan)" data-act="toggleAuthMode">Sign in</a>`}
        </p>

        <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">
          <p class="muted" style="font-size:.84rem;text-align:center;margin-bottom:10px">Or test immediately with pre-loaded accounts:</p>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <button type="button" class="btn small" data-act="demoLogin" data-role="client">Demo Client</button>
            <button type="button" class="btn small" data-act="demoLogin" data-role="editor">Demo Editor</button>
          </div>
          <div style="text-align:center;margin-top:12px">
            <button type="button" class="btn small danger" data-act="resetDemo">Reset Demo Data</button>
          </div>
        </div>
      </div>
    </div>`;
  }
};

// ==========================================
// ACTIONS & FORM HANDLERS
// ==========================================
view.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  if (btn.tagName === "A") e.preventDefault();

  const act = btn.dataset.act;

  if (act === "setMode") {
    state.browseMode = btn.dataset.mode;
    saveState(state);
    render();
  }

  if (act === "setAuthRole") {
    authRole = btn.dataset.role;
    render();
  }

  if (act === "toggleAuthMode") {
    authMode = authMode === "in" ? "up" : "in";
    render();
  }

  if (act === "demoLogin") {
    const role = btn.dataset.role;
    const demoUser = state.users.find(u => u.role === role);
    if (demoUser) {
      state.currentUserId = demoUser.id;
      state.browseMode = role;
      saveState(state);
      toast(`Signed in as Demo ${role === "client" ? "Client" : "Editor"}: ${demoUser.name}`);
      location.hash = role === "client" ? "#/explore" : "#/studio";
    }
  }

  if (act === "resetDemo") {
    localStorage.removeItem(STORAGE_KEY);
    state = loadState();
    toast("Demo profiles and CONNECTS restored to defaults.");
    render();
  }

  if (act === "pickStar") {
    const val = Number(btn.dataset.val);
    const form = btn.closest("form");
    form.querySelector('[name="stars"]').value = val;
    btn.closest("[data-star-group]").querySelectorAll(".star-btn").forEach(b => {
      b.classList.toggle("active", Number(b.dataset.val) === val);
    });
  }

  if (act === "toggleBranch") {
    const u = currentUser();
    if (!u || u.role !== "editor") return;
    const b = btn.dataset.branch;
    u.branches = u.branches || [];
    if (u.branches.includes(b)) {
      u.branches = u.branches.filter(x => x !== b);
    } else {
      u.branches.push(b);
    }
    saveState(state);
    render();
  }

  if (act === "delPortfolio") {
    const u = currentUser();
    if (!u || u.role !== "editor") return;
    u.portfolio = (u.portfolio || []).filter(p => p.id !== btn.dataset.id);
    saveState(state);
    toast("Portfolio item removed.");
    render();
  }
});

view.addEventListener("input", e => {
  if (e.target.id === "searchInput") {
    searchTerm = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const inp = $("#searchInput");
    if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
  }
});

view.addEventListener("change", e => {
  if (e.target.id === "branchSelect") {
    branchFilter = e.target.value;
    render();
  }
  if (e.target.id === "sortSelect") {
    sortBy = e.target.value;
    render();
  }
});

view.addEventListener("submit", e => {
  e.preventDefault();
  const form = e.target;
  const type = form.dataset.form;
  const fd = Object.fromEntries(new FormData(form));

  if (type === "auth") {
    const email = (fd.email || "").trim().toLowerCase();
    const password = fd.password || "";

    if (authMode === "in") {
      const found = state.users.find(u => u.email.toLowerCase() === email && u.password === password);
      if (!found) {
        toast("Invalid email or password. Try Demo Client / Demo Editor below!");
        return;
      }
      state.currentUserId = found.id;
      state.browseMode = found.role;
      saveState(state);
      toast(`Welcome back, ${found.name}!`);
      location.hash = found.role === "client" ? "#/explore" : "#/studio";
    } else {
      if (state.users.some(u => u.email.toLowerCase() === email)) {
        toast("An account with this email already exists.");
        return;
      }
      const newUser = {
        id: "u_" + Date.now(),
        name: (fd.name || "").trim(),
        email,
        password,
        role: authRole,
        bio: "",
        ...(authRole === "editor" ? {
          pricing: (fd.pricing || "$30 / video").trim(),
          experience: (fd.experience || "1 Year").trim(),
          availability: "Available Now",
          branches: [],
          connects: 0,
          projectsCompleted: 0,
          portfolio: [],
          reviews: []
        } : {
          history: []
        })
      };
      state.users.push(newUser);
      state.currentUserId = newUser.id;
      state.browseMode = newUser.role;
      saveState(state);
      toast(`Account created as ${newUser.role === "client" ? "Client" : "Editor"}!`);
      location.hash = newUser.role === "client" ? "#/explore" : "#/studio";
    }
  }

  if (type === "rateEditor") {
    const u = currentUser();
    if (!u || u.role !== "client") {
      toast("Please sign in as a Client first.");
      return;
    }
    const ed = state.users.find(x => x.id === form.dataset.editorId);
    if (!ed) return;

    const projectConnects = Math.min(10, Math.max(0, Number(fd.projectConnects || 0)));
    const stars = Math.min(5, Math.max(0, Number(fd.stars || 0)));
    const starConnects = stars * 2;
    const totalAdded = projectConnects + starConnects;
    const projectTitle = (fd.projectTitle || "Completed Project").trim();

    ed.connects = (ed.connects || 0) + totalAdded;
    if (projectConnects > 0) {
      ed.projectsCompleted = (ed.projectsCompleted || 0) + 1;
    }
    ed.reviews = ed.reviews || [];
    ed.reviews.unshift({
      clientName: u.name,
      projectTitle,
      stars,
      projectConnects,
      starConnects,
      comment: (fd.comment || "").trim()
    });

    u.history = u.history || [];
    u.history.unshift({
      editorName: ed.name,
      projectTitle,
      stars,
      connectsAwarded: totalAdded
    });

    saveState(state);
    toast(`Awarded +${totalAdded} CONNECTS to ${ed.name} (${projectConnects} project + ${starConnects} stars)!`);
    render();
  }

  if (type === "addPortfolio") {
    const u = currentUser();
    if (!u || u.role !== "editor") return;
    const branch = (fd.branch || "").trim();
    const item = {
      id: "port_" + Date.now(),
      title: (fd.title || "").trim(),
      branch,
      url: (fd.url || "").trim(),
      notes: (fd.notes || "").trim()
    };
    u.portfolio = u.portfolio || [];
    u.portfolio.unshift(item);

    u.branches = u.branches || [];
    if (branch && !u.branches.includes(branch)) {
      u.branches.push(branch);
    }

    saveState(state);
    toast(`Portfolio added & tagged under #${branch}!`);
    render();
  }

  if (type === "saveEditorProfile") {
    const u = currentUser();
    if (!u || u.role !== "editor") return;
    u.name = (fd.name || u.name).trim();
    u.pricing = (fd.pricing || "").trim();
    u.experience = (fd.experience || "").trim();
    u.availability = fd.availability || "Available Now";
    u.bio = (fd.bio || "").trim();
    saveState(state);
    toast("Editor profile saved!");
    render();
  }
});

// ==========================================
// ROUTER
// ==========================================
function render() {
  let route = location.hash.replace("#/", "").split("?")[0] || "home";

  if (route === "logout") {
    state.currentUserId = null;
    saveState(state);
    toast("Signed out.");
    location.hash = "#/home";
    return;
  }

  if (route === "join") {
    authMode = "up";
    route = "auth";
  }

  menu.classList.remove("open");
  burger.setAttribute("aria-expanded", "false");
  renderNav();

  const fn = Views[route] || Views.home;
  view.innerHTML = fn();

  initFluidLogo();
}

burger.addEventListener("click", () => {
  const open = menu.classList.toggle("open");
  burger.setAttribute("aria-expanded", String(open));
});

window.addEventListener("hashchange", () => {
  window.scrollTo(0, 0);
  render();
});

render();
</script>
</body>
</html>

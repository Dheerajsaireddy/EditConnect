<!DOCTYPE html>
<html lang="en" data-side="client">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030303">
<title>EditConnect | Skills Meet Opportunities</title>
<style>
@property --a{syntax:"<color>";inherits:true;initial-value:#168bff}
@property --b{syntax:"<color>";inherits:true;initial-value:#126bff}
@property --hue{syntax:"<angle>";inherits:true;initial-value:0deg}
:root{--a:#168bff;--b:#126bff;--hue:0deg;--muted:#8fa3bf;transition:--a .8s,--b .8s,--hue .8s;color-scheme:dark}
[data-side=editor]{--a:#ff7a22;--b:#e8381a;--hue:165deg}
*{box-sizing:border-box;margin:0}
html{background:#030303}
body{color:#fff;font:16px/1.6 system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit}
[hidden]{display:none!important}
[data-side=client] .ed,[data-side=editor] .cl{display:none}
.lights{position:fixed;inset:0;z-index:-1;overflow:hidden}
.lights i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--b) 22%,transparent),transparent 65%)}
.lights i:first-child{top:-30vmax;left:-20vmax}.lights i:last-child{bottom:-35vmax;right:-25vmax}
.nav{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(3,3,3,.92);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--a) 20%,transparent)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;letter-spacing:.03em}
.brand img{width:26px;height:26px;object-fit:contain;filter:hue-rotate(var(--hue))}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.tabs a{white-space:nowrap;padding:5px 13px;border-radius:99px;font-size:.85rem;color:var(--muted)}
.tabs a.on{color:#fff;background:color-mix(in srgb,var(--a) 22%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border:1px solid color-mix(in srgb,var(--a) 45%,transparent);border-radius:99px;background:none;color:#fff;font-weight:650;font-size:.85rem;letter-spacing:.04em;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--a)}
.btn.p{background:var(--b);border-color:transparent;box-shadow:0 0 22px color-mix(in srgb,var(--a) 45%,transparent)}
.btn.s{padding:6px 16px;font-size:.78rem}
.btn:disabled{opacity:.5}
.wrap{max-width:900px;margin:auto;padding:104px 18px 40px}
.narrow{max-width:520px}
.pt{font-size:clamp(1.7rem,5vw,2.4rem)}
.muted{color:var(--muted)}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 20px 60px}
.tog{display:inline-flex;padding:4px;border:1px solid color-mix(in srgb,var(--a) 35%,transparent);border-radius:99px;background:rgba(255,255,255,.04)}
.tog button{border:0;background:none;color:var(--muted);padding:8px 22px;border-radius:99px;font-weight:650;cursor:pointer;transition:.4s}
.tog button.on{background:var(--b);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--a) 55%,transparent)}
.orb{position:relative;width:min(78vw,360px);aspect-ratio:1;margin:10px 0}
.orb canvas{position:relative;width:100%;height:100%;filter:hue-rotate(var(--hue)) drop-shadow(0 0 24px color-mix(in srgb,var(--a) 75%,transparent))}
.halo{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 55%,transparent),transparent 70%);filter:blur(30px);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18);opacity:.55}}
h1{font-size:clamp(2rem,6.5vw,3.6rem);line-height:1.1;max-width:15ch;text-shadow:0 0 28px color-mix(in srgb,var(--a) 45%,transparent)}
.sub{max-width:32em;margin:14px 0 26px;color:var(--muted)}
.card,.panel,.stats div{border:1px solid color-mix(in srgb,var(--a) 28%,transparent);border-radius:18px;background:rgba(10,14,22,.65);padding:20px;margin-top:14px}
.card p{margin:6px 0;color:#cfd8e6}
.tag{display:inline-block;margin:0 4px 4px 0;padding:2px 11px;border:1px solid color-mix(in srgb,var(--a) 40%,transparent);border-radius:99px;color:var(--a);font-size:.76rem}
.tag.hot{background:var(--b);color:#fff;border-color:transparent}
.cn{font-size:2rem;font-weight:800;color:var(--a);line-height:1.1}.cn small{font-size:.8rem;font-weight:500;color:var(--muted)}
.field{display:block;margin-bottom:14px;color:var(--muted);font-size:.85rem}
.field input,.field textarea,.field select{display:block;width:100%;margin-top:5px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--a) 30%,transparent);border-radius:12px;background:rgba(3,3,3,.8);color:#fff}
.field textarea{min-height:80px;resize:vertical}
.roles{display:grid;gap:8px;margin-bottom:14px}
.roles label{display:block;padding:12px 14px;border:1px solid color-mix(in srgb,var(--a) 30%,transparent);border-radius:12px;cursor:pointer}
.roles small{display:block;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stats div{margin:0}.stats b{display:block;font-size:1.7rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--a) 15%,transparent)}
summary{list-style:none;cursor:pointer;width:fit-content}summary::-webkit-details-marker{display:none}
details form{margin-top:12px}
.sw{margin-top:16px;font-size:.9rem;color:var(--muted)}.sw a{color:var(--a)}
.foot{text-align:center;padding:26px 16px;border-top:1px solid color-mix(in srgb,var(--a) 20%,transparent);color:var(--muted);font-size:.8rem}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;max-width:90vw;padding:12px 18px;border:1px solid var(--a);border-radius:12px;background:#07101f}
</style>
</head>
<body>
<div class="lights"><i></i><i></i></div>
<header class="nav">
 <div class="top"><a class="brand" href="#/home"><img id="nlogo" alt=""><span>EditConnect</span></a><a id="acct" class="btn s" href="#/login">Login</a></div>
 <nav class="tabs"><a href="#/home">Home</a><a href="#/projects">Projects</a><a href="#/editors">Editors</a><a href="#/work">My Work</a><a href="#/profile">Profile</a></nav>
</header>
<main id="view"></main>
<footer class="foot">© 2026 EditConnect · Skills Meet Opportunities.<br>Other freelance subjects are coming soon.</footer>
<div id="toast" role="status" hidden></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,addDoc,deleteDoc,collection,query,where,orderBy,limit,getDocs,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDl8rk3KAYc4-AiNAUvAkeoAPopfRI8tm4",authDomain:"editconnect-77505.firebaseapp.com",projectId:"editconnect-77505",appId:"1:279328250493:web:85b70045215e737523ef14"});
const auth=getAuth(app),db=getFirestore(app);

const $=s=>document.querySelector(s),view=$("#view");
let me=null,mode="in",side="client",busy=false,onlyB=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list=s=>[...new Set((s||"").split(",").map(x=>x.trim()).filter(Boolean))].slice(0,12);
const safe=u=>/^https?:\/\//i.test(u||"")?u:"";
const isC=()=>me?.role==="Client";
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4500)};
const ERR={"auth/invalid-credential":"Incorrect email or password.","auth/email-already-in-use":"This email already has an account.","auth/weak-password":"Password needs at least 6 characters.","auth/invalid-email":"Invalid email address.","auth/network-request-failed":"Check your internet connection.","permission-denied":"Permission denied. Check the Firestore rules."};
const why=e=>ERR[e.code]||e.message||"Something went wrong.";
const setSide=s=>{side=s;document.documentElement.dataset.side=s;document.querySelectorAll("[data-sb]").forEach(b=>b.classList.toggle("on",b.dataset.sb==s))};
const pg=(t,s,b)=>`<div class="wrap"><h2 class="pt">${t}</h2><p class="muted">${s}</p>${b}</div>`;
const gate=t=>pg(t,"Login or create an account to continue.",'<br><a class="btn p" href="#/login">LOGIN →</a>');
const tags=a=>(a||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(" ");

/* ---------- logo (your PNG, with a built-in backup) ---------- */
const FB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 100 100"><defs><radialGradient id="g" cx=".35" cy=".3"><stop offset="0" stop-color="#8ff"/><stop offset=".35" stop-color="#1e78ff"/><stop offset="1" stop-color="#0a2a9a"/></radialGradient></defs><path fill="url(#g)" d="M20 52C18 32 36 18 56 16C76 14 86 30 84 48C83 58 76 62 80 70C83 78 80 84 72 84C60 84 54 76 42 78C30 80 22 68 20 52Z"/></svg>');
const logos=["logo.png","1000007354.png",FB];
const mk=el=>{let i=0;el.onerror=()=>{if(i<2)el.src=logos[++i]};el.src=logos[0];return el};
const L=mk(new Image());mk($("#nlogo"));

/* ---------- wobbling fluid logo ---------- */
const N=56;
(function loop(t){
 const cv=$("#fluid");
 if(cv&&L.naturalWidth){
  const c=cv.getContext("2d"),S=cv.width,w=L.naturalWidth,h=L.naturalHeight,z=S*.9/Math.max(w,h),dw=w*z,dh=h*z,x0=(S-dw)/2,y0=(S-dh)/2,sh=h/N,k=1+.018*Math.sin(t/1700);
  c.clearRect(0,0,S,S);c.save();c.translate(S/2,S/2);c.rotate(.02*Math.sin(t/3100));c.scale(k,k);c.translate(-S/2,-S/2);
  for(let i=0;i<N;i++){
   const o=S*.011*Math.sin(t/950+i*.21)+S*.006*Math.sin(t/1500-i*.13),s=1+.012*Math.sin(t/1200+i*.3);
   c.drawImage(L,0,i*sh,w,sh,x0+o-(dw*s-dw)/2,y0+i*dh/N,dw*s,dh/N+1);
  }
  c.restore();
 }
 requestAnimationFrame(loop);
})(0);

/* ---------- data ---------- */
const getP=async()=>(await getDocs(query(collection(db,"projects"),orderBy("created","desc"),limit(50)))).docs.map(d=>({id:d.id,...d.data()}));
const act=p=>!me?'<a class="btn s" href="#/login">LOGIN TO APPLY</a>':p.owner==me.uid?`<button class="btn s" data-a="del" data-id="${p.id}">DELETE</button>`:isC()?"":`<details><summary class="btn s">APPLY</summary><form data-f="apply" data-id="${p.id}" data-t="${esc(p.title)}" data-o="${esc(p.owner)}"><label class="field">Note to the client<textarea name="note" maxlength="400" placeholder="Why are you a good fit?"></textarea></label><button class="btn p s" type="submit">SEND APPLICATION</button></form></details>`;
const card=p=>`<article class="card"><h3>${esc(p.title)}</h3>${p.beginner?'<span class="tag hot">Beginner-friendly</span>':""}<p>${esc(p.desc)}</p><p>${tags(p.skills)}</p><p class="muted">By ${esc(p.ownerName)}${p.budget?" · Budget "+esc(p.budget):""}</p>${act(p)}</article>`;
const postForm=`<details class="panel"><summary class="btn p s">POST A PROJECT</summary><form data-f="post"><label class="field">Title<input name="title" required maxlength="80"></label><label class="field">Description<textarea name="desc" required maxlength="600"></textarea></label><label class="field">Skills needed (comma separated)<input name="skills" required></label><label class="field">Budget (optional)<input name="budget" maxlength="30"></label><label class="field"><input type="checkbox" name="beginner" style="display:inline;width:auto;margin-right:8px">Beginner-friendly</label><button class="btn p" type="submit">PUBLISH PROJECT</button></form></details>`;

/* ---------- pages ---------- */
const V={
home:()=>`<section class="hero">${me?"":`<div class="tog"><button data-sb="client" class="${side=="client"?"on":""}">Client</button><button data-sb="editor" class="${side=="editor"?"on":""}">Editor</button></div>`}<div class="orb"><div class="halo"></div><canvas id="fluid" width="420" height="420"></canvas></div><h1>Skills Meet Opportunities.</h1><p class="sub"><span class="cl">Hire the right video editor. Compare every editor by Connects, price and experience, then choose the best.</span><span class="ed">Prove your skills, earn Connects with every project, and find your first client.</span></p><a class="btn p" href="#/${me?(isC()?"editors":"projects"):"join"}">START NOW →</a></section>`,

projects:async()=>{const ps=(await getP()).filter(p=>!onlyB||p.beginner);
 return pg("Projects","Editing projects posted by clients.",`<button class="btn s ${onlyB?"p":""}" data-a="fb">Beginner-friendly only</button>`+(isC()?postForm:"")+(ps.length?ps.map(card).join(""):'<p class="muted">No projects yet.</p>'))},

editors:async()=>{
 const[us,rv]=await Promise.all([getDocs(query(collection(db,"users"),where("role","==","Editor"),limit(100))),getDocs(query(collection(db,"reviews"),limit(500)))]);
 const st={};rv.docs.forEach(d=>{const r=d.data();(st[r.editor]??={n:0,c:0});st[r.editor].n++;st[r.editor].c+=10+r.rating});
 const eds=us.docs.map(d=>({id:d.id,...d.data(),n:st[d.id]?.n||0,c:st[d.id]?.c||0})).sort((a,b)=>b.c-a.c);
 return pg("Editors","Ranked by Connects: 10 for each completed project, plus 1 for every star the client gives.",eds.length?eds.map((e,i)=>`<article class="card"><span class="tag hot">#${i+1}</span><p class="cn">${e.c} <small>Connects</small></p><h3>${esc(e.name)}</h3><p><span class="tag">${e.n} project${e.n==1?"":"s"} done</span>${e.price?`<span class="tag">Price: ${esc(e.price)}</span>`:""}${e.exp?`<span class="tag">Experience: ${esc(e.exp)}</span>`:""}</p><p>${esc(e.bio)}</p><p>${tags(e.skills)}</p>${safe(e.link)?`<a class="btn s" href="${esc(safe(e.link))}" target="_blank" rel="noopener">PORTFOLIO</a>`:""}</article>`).join(""):'<p class="muted">No editors yet.</p>')},

work:async()=>{if(!me)return gate("My Work");
 const cl=isC();
 const as=(await getDocs(query(collection(db,"applications"),where(cl?"owner":"applicant","==",me.uid)))).docs.map(d=>({id:d.id,...d.data()}));
 const rv=(await getDocs(query(collection(db,"reviews"),where(cl?"client":"editor","==",me.uid)))).docs.map(d=>({id:d.id,...d.data()}));
 const done=Object.fromEntries(rv.map(r=>[r.id,r]));
 const cn=rv.reduce((s,r)=>s+10+r.rating,0);
 const stats=cl?[[as.length,"Applications received"],[rv.length,"Projects completed"]]:[[cn,"Connects"],[rv.length,"Projects completed"],[as.length,"Applications sent"]];
 return pg("My Work",cl?"See who applied, then mark the work complete and rate the editor.":"Your applications and the Connects you have earned.",`<div class="stats">${stats.map(s=>`<div><b>${s[0]}</b><span class="muted">${s[1]}</span></div>`).join("")}</div>`+(as.length?as.map(a=>{const r=done[a.id];return `<div class="row"><span><b>${esc(cl?a.applicantName:a.projectTitle)}</b>${cl?" applied to "+esc(a.projectTitle):""}<br><span class="muted">${esc(a.note)}</span></span>${r?`<span class="tag hot">Done · ${r.rating}★</span>`:cl?`<form data-f="done" data-id="${esc(a.id)}" data-p="${esc(a.project)}" data-e="${esc(a.applicant)}"><select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n}★</option>`).join("")}</select> <button class="btn p s" type="submit">COMPLETE</button></form>`:'<span class="tag">Pending</span>'}</div>`}).join(""):'<p class="muted">Nothing here yet.</p>'))},

profile:()=>{if(!me)return gate("Profile");const ed=!isC();
 return pg("Profile",`You are signed up as ${esc(me.role)}.`,`<form class="panel" data-f="profile"><label class="field">Full name<input name="name" required maxlength="60" value="${esc(me.name)}"></label><label class="field">Short bio<textarea name="bio" maxlength="300">${esc(me.bio)}</textarea></label>${ed?`<label class="field">Skills (comma separated)<input name="skills" value="${esc((me.skills||[]).join(", "))}"></label><label class="field">Your price (e.g. 500 per video)<input name="price" maxlength="40" value="${esc(me.price)}"></label><label class="field">Experience (e.g. 2 years)<input name="exp" maxlength="40" value="${esc(me.exp)}"></label><label class="field">Portfolio link<input name="link" type="url" value="${esc(me.link)}"></label>`:""}<button class="btn p" type="submit">SAVE PROFILE</button></form>`)},

login:()=>`<div class="wrap narrow"><div class="panel"><h2>${mode=="in"?"Login":"Create your account"}</h2><br><form data-f="auth">${mode=="up"?`<label class="field">Full name<input name="name" required maxlength="60"></label><div class="roles"><label><input type="radio" name="role" value="Client" ${side=="client"?"checked":""}> <b>Client</b><small>I want to hire editors</small></label><label><input type="radio" name="role" value="Editor" ${side=="editor"?"checked":""}> <b>Editor</b><small>I want to find clients</small></label></div>`:""}<label class="field">Email<input name="email" type="email" required autocomplete="email"></label><label class="field">Password<input name="password" type="password" required minlength="6"></label><button class="btn p" type="submit">${mode=="in"?"LOGIN":"CREATE ACCOUNT"}</button></form><p class="sw">${mode=="in"?'New here? <a href="#" data-a="mode">Create an account</a>':'Already have an account? <a href="#" data-a="mode">Login</a>'}</p></div></div>`
};

/* ---------- actions ---------- */
const A={
mode:()=>{mode=mode=="in"?"up":"in";view.innerHTML=V.login()},
del:async b=>{if(!confirm("Delete this project?"))return;await deleteDoc(doc(db,"projects",b.dataset.id));toast("Project deleted.");go()},
fb:()=>{onlyB=!onlyB;go()}
};
const F={
auth:async f=>{const d=Object.fromEntries(new FormData(f));
 if(mode=="in"){await signInWithEmailAndPassword(auth,d.email,d.password)}
 else{busy=true;try{const c=await createUserWithEmailAndPassword(auth,d.email,d.password);
  await setDoc(doc(db,"users",c.user.uid),{name:d.name.trim(),role:d.role,bio:"",skills:[],price:"",exp:"",link:"",created:serverTimestamp()});
  await load(c.user);location.hash="#/work"}finally{busy=false}}},
post:async f=>{const d=Object.fromEntries(new FormData(f));
 await addDoc(collection(db,"projects"),{owner:me.uid,ownerName:me.name||"Client",title:d.title.trim(),desc:d.desc.trim(),skills:list(d.skills),budget:d.budget.trim(),beginner:!!d.beginner,created:serverTimestamp()});
 toast("Project published.");go()},
apply:async f=>{const d=f.dataset;
 await setDoc(doc(db,"applications",d.id+"_"+me.uid),{project:d.id,projectTitle:d.t,owner:d.o,applicant:me.uid,applicantName:me.name||"",note:new FormData(f).get("note").trim(),created:serverTimestamp()});
 toast("Application sent.");f.closest("details").open=false},
done:async f=>{const d=f.dataset,rt=+new FormData(f).get("rating");
 await setDoc(doc(db,"reviews",d.id),{project:d.p,editor:d.e,client:me.uid,rating:rt,created:serverTimestamp()});
 toast("Marked complete. Connects awarded.");go()},
profile:async f=>{const d=Object.fromEntries(new FormData(f));const p={name:d.name.trim(),bio:d.bio.trim(),role:me.role};
 if(!isC())Object.assign(p,{skills:list(d.skills),price:(d.price||"").trim(),exp:(d.exp||"").trim(),link:safe((d.link||"").trim())});
 await setDoc(doc(db,"users",me.uid),p,{merge:true});Object.assign(me,p);toast("Profile saved.")}
};

view.addEventListener("click",async e=>{
 const s=e.target.closest("[data-sb]");if(s){setSide(s.dataset.sb);return}
 const b=e.target.closest("[data-a]");if(!b)return;
 if(b.tagName=="A")e.preventDefault();
 try{await A[b.dataset.a](b)}catch(x){toast(why(x))}
});
view.addEventListener("change",e=>{if(e.target.name=="role")setSide(e.target.value.toLowerCase())});
view.addEventListener("submit",async e=>{
 e.preventDefault();const f=e.target,b=f.querySelector('[type=submit]');if(b)b.disabled=true;
 try{await F[f.dataset.f](f)}catch(x){toast(why(x))}finally{if(b)b.disabled=false}
});

/* ---------- login state + router ---------- */
async function load(u){
 me=null;
 if(u){me={uid:u.uid,name:u.displayName||"",role:"Editor",bio:"",skills:[],price:"",exp:"",link:""};
  const s=await getDoc(doc(db,"users",u.uid));if(s.exists())Object.assign(me,s.data());
  setSide(me.role=="Client"?"client":"editor")}
 const a=$("#acct");a.textContent=me?"Logout":"Login";a.href=me?"#/out":"#/login";
}
async function go(){
 let r=location.hash.replace("#/","")||"home";
 if(r=="out"){await signOut(auth);me=null;setSide("client");location.hash="#/home";return}
 if(r=="join"){mode="up";r="login"}else if(r=="login")mode="in";
 document.querySelectorAll(".tabs a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#/"+r));
 view.innerHTML='<p class="wrap muted">Loading...</p>';
 try{view.innerHTML=await(V[r]||V.home)()}
 catch(e){view.innerHTML=pg("Something went wrong",esc(why(e)),'<a class="btn" href="#/home">GO HOME</a>')}
 scrollTo(0,0);
}
window.addEventListener("hashchange",go);
onAuthStateChanged(auth,async u=>{
 if(busy)return;
 try{await load(u);if(me&&location.hash=="#/login")location.hash="#/work";else await go()}
 catch(e){toast(why(e));await go()}
});
</script>
 <script type="module" src="firebase/firebase-google.js"></script>
</body>
</html>
